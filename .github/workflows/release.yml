name: CI & CD Release Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  # 阶段 1：质量门禁 (单元测试与 90% 覆盖率检查)
  test:
    name: Run TDD Tests & 90% Coverage Gate
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest with 90% Coverage Gate
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ --cov=src/gifcreater/core --cov=gif_tool --cov-report=term-missing --cov-fail-under=90

  # 阶段 2：自动化打包与 Release 部署
  build-and-release:
    name: Build Executable & Deploy Release
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build Windows Executable via PyInstaller
        run: |
          pyinstaller GifCreater.spec

      - name: Compress Release Package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\GifCreater.exe" -DestinationPath "dist\GifCreater-windows-x64.zip" -Force
          Get-ChildItem dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GifCreater-windows-x64
          path: |
            dist/GifCreater.exe
            dist/GifCreater-windows-x64.zip

      # 自动滚动发布 Latest 绿色免安装版 (推送至 main 分支时自动触发)
      - name: Publish Latest Rolling Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 'GifCreater 最新构建版 (Continuous Latest)'
          body: |
            ## 🎞️ GifCreater 最新自动构建免安装版

            此版本由 GitHub Actions 流水线全自动编译生成（已通过 90% TDD 单元测试门禁）。
            - **关联 Commit**: `${{ github.sha }}`
            - **更新时间**: `${{ github.event.head_commit.timestamp }}`

            ### 📥 绿色安装包下载直链：
            - 📦 **[GifCreater-windows-x64.zip (ZIP 压缩包推荐)](https://github.com/${{ github.repository }}/releases/download/latest/GifCreater-windows-x64.zip)**
            - ⚡ **[GifCreater.exe (独立可执行文件直下)](https://github.com/${{ github.repository }}/releases/download/latest/GifCreater.exe)**
          files: |
            dist/GifCreater.exe
            dist/GifCreater-windows-x64.zip
          draft: false
          prerelease: false
          make_latest: true

      # 正式里程碑版本发布 (推送 v* 标签时自动触发)
      - name: Publish Tagged Milestone Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GifCreater.exe
            dist/GifCreater-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
