name: CI & CD Release Pipeline

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - 'README_zh.md'
      - 'LICENSE'
      - '.gitignore'
      - '.agent/**'
      - 'docs/prototype.html'
      - 'docs/ui_prototype.md'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - 'README_zh.md'
      - 'LICENSE'
      - '.gitignore'
      - '.agent/**'
      - 'docs/prototype.html'
      - 'docs/ui_prototype.md'
  workflow_dispatch:


permissions:
  contents: write

jobs:
  # 阶段 1：质量门禁 (单元测试与 90% 覆盖率检查)
  test:
    name: Run TDD Tests & 90% Coverage Gate
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify Documentation Synchronization
        run: |
          python scripts/tools/check_doc_sync.py

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Pytest with 90% Coverage Gate
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ --cov=src/gifcreater/core --cov=gif_tool --cov-report=term-missing --cov-fail-under=90


  # 阶段 2：自动化打包与 Release 部署 (仅限打 v* 版本 Tag 或手动调度时执行)
  build-and-release:
    name: Build Executable & Deploy Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build Windows Executable via PyInstaller
        run: |
          pyinstaller GifCreater.spec

      - name: Compress Release Package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\GifCreater.exe" -DestinationPath "dist\GifCreater-windows-x64.zip" -Force
          Get-ChildItem dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GifCreater-windows-x64
          path: |
            dist/GifCreater.exe
            dist/GifCreater-windows-x64.zip

      # 正式里程碑版本发布 (通过 v* 标签或手动调度触发)
      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GifCreater.exe
            dist/GifCreater-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true

